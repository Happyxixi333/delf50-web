<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b6b58"><title>DELF50 V1.5.1 · A1+ → B1</title><style>:root{--bg:#f4f7f5;--card:#fff;--ink:#18332d;--muted:#6c7d78;--line:#dfe9e5;--brand:#0b6b58;--soft:#e9f4f0;--warn:#8a5a12;--warnbg:#fff6df;--bad:#7c403d;--badbg:#fbefee;--good:#225d49;--goodbg:#e8f5ef;--blue:#2e5f8a;--bluebg:#edf5fb}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}button,textarea,input,select{font:inherit}.app{max-width:860px;margin:auto;min-height:100vh;padding:18px 14px 92px}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin:4px 0 12px}.eyebrow{font-size:11px;letter-spacing:.12em;font-weight:800;color:var(--brand)}h1{margin:4px 0 2px;font-size:28px}h2{font-size:19px;margin:8px 0}.muted{color:var(--muted);font-size:12px;line-height:1.6}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;margin:10px 0;box-shadow:0 8px 28px rgba(20,60,50,.045)}.hero{background:linear-gradient(145deg,#0e745f,#095849);color:#fff;border:0}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.wrap{flex-wrap:wrap}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.metric{border:1px solid var(--line);background:#fbfdfc;border-radius:13px;padding:11px}.metric b{display:block;font-size:19px;margin-top:3px}.metric span{font-size:10px;color:var(--muted)}.pill{display:inline-block;font-size:10px;font-weight:750;background:var(--soft);color:#42655d;border-radius:999px;padding:6px 8px;margin:2px 4px 2px 0}.pill.blue{background:var(--bluebg);color:var(--blue)}.btn{border:0;background:var(--brand);color:#fff;font-weight:800;border-radius:13px;padding:12px 14px;cursor:pointer}.btn.secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.small{padding:8px 10px;font-size:11px}.task{display:grid;grid-template-columns:52px 1fr auto;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);align-items:start}.task:last-child{border-bottom:0}.time{font-size:12px;font-weight:800;color:var(--brand);background:var(--soft);padding:7px 6px;border-radius:10px;text-align:center}.task b{font-size:14px}.task .desc{font-size:12px;line-height:1.55;color:var(--muted);margin-top:4px}.check{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--muted)}.callout{padding:11px 12px;border-radius:12px;font-size:12px;line-height:1.65}.callout.warn{background:var(--warnbg);color:var(--warn)}.callout.bad{background:var(--badbg);color:var(--bad)}.tabs{display:flex;gap:6px;overflow:auto}.tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px}.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px;margin:7px 0}.node{padding:12px 0;border-bottom:1px solid var(--line)}.textarea{width:100%;min-height:165px;border:1px solid var(--line);border-radius:13px;padding:12px}.nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(860px,100%);display:grid;grid-template-columns:repeat(6,1fr);background:rgba(255,255,255,.97);border-top:1px solid var(--line);z-index:20}.nav button{border:0;background:transparent;color:#73837f;font-size:10px;padding:9px 2px}.fallback{max-width:860px;margin:auto;padding:24px 14px}.loadstatus{display:inline-block;border-radius:999px;padding:6px 9px;font-size:11px;font-weight:800;background:#fff6df;color:#8a5a12}.loadstatus.ok{background:#e8f5ef;color:#225d49}.loadstatus.bad{background:#fbefee;color:#7c403d}#root[hidden],#fallback[hidden]{display:none!important}@media(max-width:640px){.grid2,.grid3{grid-template-columns:1fr}.task{grid-template-columns:46px 1fr auto}.top{display:block}}</style></head><body><div id="fallback" class="fallback"><h1>Day 1 · 阶段1 · 语法手感</h1><div class="card"><div class="row wrap"><div><b>DELF50 V1.5.1</b><div class="muted">稳定启动器：全部课程资源到齐后才启动交互。</div></div><span id="loaderStatus" class="loadstatus">正在校验 0/13</span></div><div id="loaderError" class="callout warn" style="margin-top:12px">当前仍为静态模式。即使资源异常，页面也不会白屏。</div></div><div class="card hero"><h2>6.5小时 今日计划</h2><div class="muted" style="color:#d8eee8">语法 10 道 + 8 个主动产出 · 应用3项 · 听力3组 · 阅读3篇 · 写作1项 · 口语3轮</div></div><div class="card"><div class="task"><div class="time">85<br>min</div><div><b>语法专项</b><div class="desc">识别 → 变形 → 纠错 → 造句 → 情境调用。</div></div><div class="check">→</div></div><div class="task"><div class="time">60<br>min</div><div><b>应用专项</b><div class="desc">真实任务：请求、叙事、建议、投诉与观点。</div></div><div class="check">→</div></div><div class="task"><div class="time">100<br>min</div><div><b>听读训练</b><div class="desc">分阶段听力和阅读，客观题才进入正确率。</div></div><div class="check">→</div></div></div></div><div id="root" hidden></div><script>(()=>{'use strict';const FILES=['base/data-a.js','base/data-b1.js','base/data-b2.js','base/app-a1.js','base/app-a2.js','base/app-a3.js','base/app-b.js','v13-p1.js','v13-p2.js','v13-p3.js','v13-p4.js','v13-p5.js','v15-patch.js'];const status=document.getElementById('loaderStatus'),err=document.getElementById('loaderError'),fallback=document.getElementById('fallback'),root=document.getElementById('root');let current='',runtimeError=null;window.addEventListener('error',e=>{runtimeError={file:current,message:String(e.message||e.error||'unknown error')};});function setStatus(text,cls=''){status.textContent=text;status.className='loadstatus '+cls;}async function getText(file,i){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),12000);try{const r=await fetch('/api/source?i='+i+'&v=c687c5',{cache:'no-store',signal:controller.signal});if(!r.ok)throw new Error(file+' HTTP '+r.status);return await r.text();}finally{clearTimeout(timer);}}function exec(code,name){runtimeError=null;current=name;const s=document.createElement('script');s.text=code+'\n//# sourceURL='+name;document.body.appendChild(s);s.remove();if(runtimeError)throw new Error(runtimeError.file+': '+runtimeError.message);}(async()=>{try{const codes=[];for(let i=0;i<FILES.length;i++){setStatus('正在校验 '+i+'/'+FILES.length);codes.push(await getText(FILES[i],i));}setStatus('资源完整，正在启动');for(let i=0;i<FILES.length;i++)exec(codes[i],FILES[i]);root.hidden=false;fallback.hidden=true;setStatus('交互已启动','ok');}catch(e){console.error(e);root.hidden=true;fallback.hidden=false;setStatus('仅静态模式','bad');err.className='callout bad';err.textContent='完整交互未启动：'+String(e.message||e)+'。请刷新重试；静态学习计划仍可查看。';}})();})();</script></body></html>
